# ccl model registry. One model per line, whitespace-separated:
#   name  hf_repo  tool_parser  min_gpus  max_len  [extra vllm args...]
# - name: no '/' or spaces; also the --served-model-name seen by Claude Code
# - tool_parser: vLLM --tool-call-parser (openai for gpt-oss, qwen3_coder, glm45, hermes, ...)
# - min_gpus: default tensor-parallel size, sized for L40S (48 GB). On H100/H200 you can often use fewer (-l).
# - max_len: default --max-model-len (override per run with -c)
# FP8 models need Ada/Hopper/Blackwell (L40S, H100, H200, B200) - all of mit_normal_gpu qualifies.
gpt-oss-20b          openai/gpt-oss-20b                       openai       1  65536
gpt-oss-120b         openai/gpt-oss-120b                      openai       2  65536
qwen3-coder-30b-fp8  Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8    qwen3_coder  1  65536   --gpu-memory-utilization 0.92
qwen3-coder-30b      Qwen/Qwen3-Coder-30B-A3B-Instruct        qwen3_coder  2  65536
